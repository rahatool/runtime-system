name: Build V8 (Configurable)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options: [release, debug]
      linkage_type:
        description: "Linkage type"
        required: true
        default: "static"
        type: choice
        options: [static, shared]
      target_cpu:
        description: "Target CPU architecture"
        required: true
        default: "x64"
        type: choice
        options: [x64, arm64]
      sandbox:
        description: "Enable V8 sandbox?"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  build-v8:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install -y git python ninja

      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${{ github.workspace }}\\depot_tools" >> $env:GITHUB_PATH

      - name: Fetch V8
        run: |
          mkdir v8
          cd v8
          fetch v8
          gclient sync

      - name: Configure GN args
        run: |
          cd v8/v8
          # Map workflow inputs to GN args
          $is_debug = if ($env:GITHUB_EVENT_INPUTS_BUILD_TYPE -eq "debug") { "true" } else { "false" }
          $is_component = if ($env:GITHUB_EVENT_INPUTS_LINKAGE_TYPE -eq "shared") { "true" } else { "false" }
          $cpu = "${{ github.event.inputs.target_cpu }}"
          $sandbox = "${{ github.event.inputs.sandbox }}"

          echo @"
          is_debug = $is_debug
          target_cpu = "$cpu"
          is_component_build = $is_component
          v8_enable_sandbox = $sandbox
          v8_use_external_startup_data = false
          use_custom_libcxx = false
          use_lld = false
          is_clang = false
          "@ > args.gn

          gn gen out/Build --args="`Get-Content args.gn | Out-String`"

      - name: Build V8 with Ninja
        run: |
          cd v8/v8
          ninja -C out/Build d8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v8-${{ github.event.inputs.build_type }}-${{ github.event.inputs.linkage_type }}-${{ github.event.inputs.target_cpu }}-sandbox${{ github.event.inputs.sandbox }}
          path: v8/v8/out/Build/**
