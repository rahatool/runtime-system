name: Build Custom V8 for Windows (MinGW)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug
      linkage:
        description: 'Linkage type'
        required: true
        default: 'static'
        type: choice
        options:
        - static
        - component
      target_cpu:
        description: 'Target CPU architecture'
        required: true
        default: 'x64'
        type: choice
        options:
        - x64
        - arm64

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          python
          mingw-w64-x86_64-toolchain

    - name: Checkout depot_tools
      run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:/depot_tools
      shell: msys2 {0}

    # FIX: This step has been removed as it was unreliable.
    # We will now use absolute paths to call depot_tools commands.
    # - name: Add depot_tools to PATH
    #   run: echo "C:/depot_tools" >> $GITHUB_PATH
    #   shell: msys2 {0}
      
    - name: Run gclient self-update
      # FIX: Use absolute path to gclient
      run: C:/depot_tools/gclient
      shell: msys2 {0}

    - name: Fetch V8 Source Code
      # FIX: Use absolute path to fetch
      run: C:/depot_tools/fetch v8
      shell: msys2 {0}
      
    - name: Configure V8 Build (GN)
      id: configure_v8
      working-directory: v8
      run: |
        IS_DEBUG="false"
        if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
          IS_DEBUG="true"
        fi
        
        IS_COMPONENT="false"
        if [ "${{ github.event.inputs.linkage }}" == "component" ]; then
          IS_COMPONENT="true"
        fi

        OUTPUT_DIR="out.gn/${{ github.event.inputs.target_cpu }}-${{ github.event.inputs.build_type }}-${{ github.event.inputs.linkage }}"
        echo "output_dir=$OUTPUT_DIR" >> $GITHUB_OUTPUT

        echo "is_debug = $IS_DEBUG" > "$OUTPUT_DIR/args.gn"
        echo "is_component_build = $IS_COMPONENT" >> "$OUTPUT_DIR/args.gn"
        echo "target_cpu = \"${{ github.event.inputs.target_cpu }}\"" >> "$OUTPUT_DIR/args.gn"
        
        echo 'v8_enable_sandbox = false' >> "$OUTPUT_DIR/args.gn"
        echo 'v8_use_external_startup_data = false' >> "$OUTPUT_DIR/args.gn"
        echo 'use_custom_libcxx = false' >> "$OUTPUT_DIR/args.gn"
        echo 'use_lld = false' >> "$OUTPUT_DIR/args.gn"
        echo 'is_clang = false' >> "$OUTPUT_DIR/args.gn"
        
        # FIX: Use absolute path to gn
        C:/depot_tools/gn gen "$OUTPUT_DIR"
      shell: msys2 {0}

    - name: Compile V8
      working-directory: v8
      # FIX: Use absolute path to autoninja
      run: C:/depot_tools/autoninja -C ${{ steps.configure_v8.outputs.output_dir }}
      shell: msys2 {0}

    - name: Package V8 Artifacts
      working-directory: v8
      run: |
        mkdir -p package/lib
        mkdir -p package/include
        
        cp ${{ steps.configure_v8.outputs.output_dir }}/obj/v8_monolith.a package/lib/
        cp -r include/* package/include/
      shell: msys2 {0}
    
    - name: Upload V8 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: v8-${{ github.event.inputs.target_cpu }}-${{ github.event.inputs.build_type }}-${{ github.event.inputs.linkage }}
        path: v8/package/