name: Build V8 for Windows (MinGW-x64-Release-Static)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Install Git for Windows (needed by depot_tools)
    - name: Install Git for Windows
      run: |
        choco install git -y --no-progress
        # Add Git to PATH for subsequent steps
        $gitPath = "C:\Program Files\Git\cmd"
        echo "$gitPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh

    - name: Verify Git Installation
      run: |
        $env:PATH = "C:\Program Files\Git\cmd;$env:PATH"
        git --version
        Write-Host "Git is available at: $(Get-Command git | Select-Object -ExpandProperty Source)"
      shell: pwsh

    # Give this step an ID so we can reference its output path
    - name: Set up MSYS2
      id: setup-msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          python
          mingw-w64-x86_64-toolchain

    - name: Checkout depot_tools
      run: |
        $env:PATH = "C:\Program Files\Git\cmd;$env:PATH"
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:/depot_tools
      shell: pwsh
      
    - name: Run gclient self-update
      env:
        DEPOT_TOOLS_UPDATE: 0
      run: |
        $env:PATH = "C:\Program Files\Git\cmd;C:\depot_tools;$env:PATH"
        C:/depot_tools/gclient
      shell: pwsh

    - name: Fetch V8 Source Code
      env:
        DEPOT_TOOLS_UPDATE: 0
      run: |
        $env:PATH = "C:\Program Files\Git\cmd;C:\depot_tools;$env:PATH"
        C:/depot_tools/fetch v8
      shell: pwsh
      
    - name: Verify V8 directory
      run: |
        Write-Host "Current directory: $(Get-Location)"
        if (Test-Path "v8") {
          Write-Host "✓ v8 directory exists"
          Get-ChildItem v8 -Name | Select-Object -First 10
        } else {
          Write-Host "✗ v8 directory not found. Listing current directory:"
          Get-ChildItem -Name
        }
      shell: pwsh
      
    - name: Configure V8 Build (GN)
      id: configure_v8
      run: |
        cd v8
        
        $OUTPUT_DIR = "out.gn/x64-release-static"
        echo "output_dir=$OUTPUT_DIR" >> $env:GITHUB_OUTPUT

        # Create output directory
        New-Item -ItemType Directory -Force -Path $OUTPUT_DIR | Out-Null

        # Write args.gn with fixed configuration
        "is_debug = false" | Out-File -FilePath "$OUTPUT_DIR/args.gn" -Encoding ASCII
        "target_cpu = `"x64`"" | Out-File -FilePath "$OUTPUT_DIR/args.gn" -Encoding ASCII -Append
        "is_component_build = false" | Out-File -FilePath "$OUTPUT_DIR/args.gn" -Encoding ASCII -Append
        "v8_enable_sandbox = false" | Out-File -FilePath "$OUTPUT_DIR/args.gn" -Encoding ASCII -Append
        "v8_use_external_startup_data = false" | Out-File -FilePath "$OUTPUT_DIR/args.gn" -Encoding ASCII -Append
        "use_custom_libcxx = false" | Out-File -FilePath "$OUTPUT_DIR/args.gn" -Encoding ASCII -Append
        "use_lld = false" | Out-File -FilePath "$OUTPUT_DIR/args.gn" -Encoding ASCII -Append
        "is_clang = false" | Out-File -FilePath "$OUTPUT_DIR/args.gn" -Encoding ASCII -Append
        
        Write-Host "Generated args.gn:"
        Get-Content "$OUTPUT_DIR/args.gn"
        
        $env:PATH = "C:\Program Files\Git\cmd;C:\depot_tools;$env:PATH"
        C:/depot_tools/gn gen $OUTPUT_DIR
      shell: pwsh

    - name: Compile V8
      run: |
        $env:PATH = "C:\Program Files\Git\cmd;C:\depot_tools;$env:PATH"
        cd v8
        C:/depot_tools/autoninja -C ${{ steps.configure_v8.outputs.output_dir }}
      shell: pwsh

    - name: Package V8 Artifacts
      run: |
        cd v8
        
        New-Item -ItemType Directory -Force -Path package/lib | Out-Null
        New-Item -ItemType Directory -Force -Path package/include | Out-Null
        
        Copy-Item "${{ steps.configure_v8.outputs.output_dir }}/obj/v8_monolith.a" -Destination "package/lib/"
        Copy-Item -Recurse "include/*" -Destination "package/include/"
      shell: pwsh
    
    - name: Upload V8 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: v8-x64-release-static-mingw
        path: v8/package/