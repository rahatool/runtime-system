name: Build Custom V8 for Windows (MinGW)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug
      linkage:
        description: 'Linkage type'
        required: true
        default: 'static'
        type: choice
        options:
        - static
        - component
      target_cpu:
        description: 'Target CPU architecture'
        required: true
        default: 'x64'
        type: choice
        options:
        - x64
        - arm64

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Install Git for Windows (needed by depot_tools)
    - name: Install Git for Windows
      run: |
        choco install git -y --no-progress
        refreshenv
      shell: pwsh

    # Give this step an ID so we can reference its output path
    - name: Set up MSYS2
      id: setup-msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          python
          mingw-w64-x86_64-toolchain

    - name: Checkout depot_tools
      run: git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:/depot_tools
      shell: pwsh
      
    - name: Run gclient self-update
      env:
        DEPOT_TOOLS_UPDATE: 0
      run: C:/depot_tools/gclient
      shell: pwsh

    - name: Fetch V8 Source Code
      env:
        DEPOT_TOOLS_UPDATE: 0
      run: C:/depot_tools/fetch v8
      shell: pwsh
      
    - name: Configure V8 Build (GN)
      id: configure_v8
      working-directory: v8
      run: |
        $IS_DEBUG = "false"
        if ("${{ github.event.inputs.build_type }}" -eq "debug") {
          $IS_DEBUG = "true"
        }
        
        $IS_COMPONENT = "false"
        if ("${{ github.event.inputs.linkage }}" -eq "component") {
          $IS_COMPONENT = "true"
        }

        $OUTPUT_DIR = "out.gn/${{ github.event.inputs.target_cpu }}-${{ github.event.inputs.build_type }}-${{ github.event.inputs.linkage }}"
        echo "output_dir=$OUTPUT_DIR" >> $env:GITHUB_OUTPUT

        # Create output directory
        New-Item -ItemType Directory -Force -Path $OUTPUT_DIR | Out-Null

        # Write args.gn
        @"
        is_debug = $IS_DEBUG
        is_component_build = $IS_COMPONENT
        target_cpu = "${{ github.event.inputs.target_cpu }}"
        v8_enable_sandbox = false
        v8_use_external_startup_data = false
        use_custom_libcxx = false
        use_lld = false
        is_clang = false
        "@ | Out-File -FilePath "$OUTPUT_DIR/args.gn" -Encoding ASCII
        
        C:/depot_tools/gn gen $OUTPUT_DIR
      shell: pwsh

    - name: Compile V8
      working-directory: v8
      run: C:/depot_tools/autoninja -C ${{ steps.configure_v8.outputs.output_dir }}
      shell: pwsh

    - name: Package V8 Artifacts
      working-directory: v8
      run: |
        New-Item -ItemType Directory -Force -Path package/lib | Out-Null
        New-Item -ItemType Directory -Force -Path package/include | Out-Null
        
        Copy-Item "${{ steps.configure_v8.outputs.output_dir }}/obj/v8_monolith.a" -Destination "package/lib/"
        Copy-Item -Recurse "include/*" -Destination "package/include/"
      shell: pwsh
    
    - name: Upload V8 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: v8-${{ github.event.inputs.target_cpu }}-${{ github.event.inputs.build_type }}-${{ github.event.inputs.linkage }}
        path: v8/package/