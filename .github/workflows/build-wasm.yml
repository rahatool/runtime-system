name: Build Custom Wasmtime

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # Using Windows since you are on PowerShell

    steps:
    - name: Checkout Wasmtime
      uses: actions/checkout@v4
      with:
        repository: bytecodealliance/wasmtime
        ref: main # Get the absolute latest bleeding-edge code

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Build Wasmtime with All Features
      shell: bash
      run: |
        # We enable generic 'experimental' features plus specific Cranelift requirements
        # 'wasi-common' provides the legacy WASI support
        # 'component-model' provides WASI Preview 2
        # 'cranelift/all-arch' ensures backend support
        
        # We pass specific RUSTFLAGS to enable unstable compiler features required for stack switching
        export RUSTFLAGS="--cfg wasmtime_unstable"
        
        cargo build --release --bin wasmtime --features "all-arch,component-model,wasi-common,cache,wasi-http,wasi-nn,wasi-threads,winch"
        
        # Note: 'stack-switching' is often gated by the 'wasmtime_unstable' config flag rather than a cargo feature.
        # By setting RUSTFLAGS="--cfg wasmtime_unstable", we unlock the internal implementations.

    - name: Verify Version & Features
      shell: powershell
      run: |
        ./target/release/wasmtime.exe --version
        ./target/release/wasmtime.exe run -W help

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wasmtime-custom-windows
        path: target/release/wasmtime.exe
